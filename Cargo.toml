[package]
name = "route_adapter"
version = "0.1.0"
edition = "2021"
description = "Guarded Soroswap-shaped route adapter for push-input Soroban AMMs"
license = "Apache-2.0"
repository = "https://github.com/Confihub/route_adapter"
readme = "README.md"
keywords = ["stellar", "soroban", "amm", "defi"]
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.5"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

# Soroban contracts build as small, LTO'd cdylibs for wasm.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
